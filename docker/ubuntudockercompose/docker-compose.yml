services:
  juice-shop:
    image: bkimminich/juice-shop:snapshot
    container_name: juice-shop
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: juice-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - juice-shop
    restart: unless-stopped